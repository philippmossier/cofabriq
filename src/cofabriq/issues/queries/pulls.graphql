# The newest 100 open pull requests and their branches.
query ($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    pullRequests(
      states: OPEN
      first: 100
      orderBy: { field: CREATED_AT, direction: DESC }
    ) {
      nodes {
        number
        headRefName
      }
    }
  }
}
